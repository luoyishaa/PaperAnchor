name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Check committed frontend bundle
        run: test -z "$(git status --porcelain -- src/paperanchor/static)"
      - name: Install
        run: python -m pip install -e '.[dev]' build
      - name: Run tests
        run: python -m pytest -q
      - name: Check wheel includes the frontend
        run: |
          python -m build --wheel
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('*.whl')); names = ZipFile(wheel).namelist(); assert 'paperanchor/static/index.html' in names; assert any(name.startswith('paperanchor/static/assets/') and name.endswith('.js') for name in names)"
