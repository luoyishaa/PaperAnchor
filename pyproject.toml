[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperanchor"
version = "0.1.0"
description = "Evidence-grounded question answering over research PDFs"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "openai>=1.84,<2",
  "anthropic>=1,<2",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "fastembed>=0.8,<0.9",
  "onnxruntime>=1.19,<1.20; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
paperanchor = "paperanchor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperanchor = ["static/*.html", "static/*.svg", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
